[package]
name = "zealous-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zealous-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 同步 HTTP 客户端:V1 本地优先不需要 async 运行时;
# TLS 用 native-tls(Windows=schannel),避免 rustls/ring 需要 C 工具链
ureq = { version = "2", default-features = false, features = ["native-tls"] }
