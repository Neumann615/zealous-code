[package]
name = "zealous-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zealous"
path = "src/main.rs"

[dependencies]
zealous-core = { workspace = true }
zealous-engine = { workspace = true }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# Ctrl-C:handler 内只设标志位,不做 IO(spec 60 §3)
ctrlc = "3"
