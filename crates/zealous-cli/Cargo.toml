[package]
name = "zealous-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zealous"
path = "src/main.rs"

[dependencies]
zealous-core = { workspace = true }
zealous-engine = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# TUI(spec 90):ratatui 只允许出现在 zealous-cli
ratatui = "0.30.2"
crossterm = "0.29.0"
# Ctrl-C:handler 内只设标志位,不做 IO(spec 60 §3)
ctrlc = "3"
