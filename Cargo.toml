[workspace]
resolver = "2"
members = [
    "crates/zealous-core",
    "crates/zealous-engine",
    "crates/zealous-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zealous-core = { path = "crates/zealous-core" }
zealous-engine = { path = "crates/zealous-engine" }
